action:
  type: url
  comment: Where submissions are posted. A page on this site, such as a thank-you page (or blank for same page), also works with CloudCannon Forms. For another service, enter its endpoint URL.
method:
  type: select
  comment: How the form-data is sent. Use POST unless the endpoint is a search or filter that should be linkable.
  options:
    values:
      - id: post
        name: POST
      - id: get
        name: GET
honeypotName:
  type: text
  comment: Name of a decoy field, hidden from visitors, that spam bots tend to fill in. CloudCannon Forms uses `_gotcha`; another service may use a different name. Leave blank for none.
successMessage:
  type: text
  comment: Message shown when the visitor comes back to this page with `?success` on the end of the URL. With CloudCannon Forms, set Action to this page's URL plus `?success`. With another service, set its redirect to that URL. Leave blank for none.
formBlocks:
  type: array
  comment: The fields of the form. For CloudCannon Forms, add a Hidden field named `inbox_key` whose value is the CloudCannon Inbox that receives submissions. See [Inbox keys](https://cloudcannon.com/documentation/developer-articles/connecting-your-site-to-an-inbox/).
  options:
    structures: _structures.formBlocks

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely. Has no effect on the first block in a container.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
