name:
  type: text
  comment: The key this value arrives under in the submission. Must be unique within the form. Name it `inbox_key` to set the CloudCannon Inbox that receives submissions. See [Inbox keys](https://cloudcannon.com/documentation/developer-articles/connecting-your-site-to-an-inbox/).
value:
  type: text
  comment: The value to be stored in the hidden field.
